name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        # Retry: the Electron binary download occasionally returns 5xx on CI.
        run: |
          for i in 1 2 3; do
            npm install && break
            echo "npm install failed (attempt $i) — retrying in 20s…"
            sleep 20
          done

      - name: Set version from tag
        shell: bash
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - name: Generate icons
        run: npm run icons

      - name: Build and upload to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: npm run release

      # Publish only after every asset (incl. latest.yml) is uploaded, so the
      # auto-updater never sees a half-published release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
